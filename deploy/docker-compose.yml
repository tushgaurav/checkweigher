# Raspberry Pi / edge deployment: TimescaleDB + migrations + collector + API (serves the dashboard).
#   cp deploy/.env.example deploy/.env && cp deploy/config.example.yaml deploy/config.yaml   # then edit both
#   docker compose -f deploy/docker-compose.yml up -d --build
name: checkweigher

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: checkweigher:latest
  env_file: .env
  environment:
    CW_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  volumes:
    - ./config.yaml:/config/config.yaml:ro
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.31.0-pg17
    env_file: .env
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c max_connections=40
      -c timezone=UTC
      -c timescaledb.telemetry_level=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["cw-migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  collector:
    <<: *app
    command: ["cw-collector"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - spool:/data/spool          # set collector.spool_dir: /data/spool in config.yaml
    # Map each USB-RS232 adapter by its stable path and use the container path in config.yaml.
    # devices:
    #   - /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1:1.0-port0:/dev/cw01
    group_add: [dialout]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    <<: *app
    command: ["cw-api"]
    ports:
      - "80:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  spool:
